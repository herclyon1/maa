<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>游戏机遥控</title>
<link rel="manifest" href="manifest.webmanifest?v=20260831084233">
<style>
  /* 浅色是底色，深色只覆盖变量。三种情况都要照顾到：
     手机设成浅色、手机设成深色、以及页面里手动指定。 */
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e2e8f0; --ink:#111826;
    --dim:#64748b; --field:#f8fafc; --btn:#eef2f7; --sh:0 1px 2px rgba(16,24,40,.06);
    --accent:#4aa3ff; --ok:#2da44e; --warn:#bf8700; --bad:#cf222e;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1216; --card:#171c22; --line:#242c35; --ink:#e6edf3;
      --dim:#8b98a5; --field:#0d1117; --btn:#232b34; --sh:none;
      --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1216; --card:#171c22; --line:#242c35; --ink:#e6edf3;
    --dim:#8b98a5; --field:#0d1117; --btn:#232b34; --sh:none;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
       padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px)}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg) 94%, transparent);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
  h1{margin:0;font-size:19px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px;margin-top:3px;display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--bad)}
  main{padding:14px 12px;max-width:640px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
          margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
  h2{margin:0;padding:14px 15px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);
     display:flex;justify-content:space-between;align-items:center}
  h2 small{color:var(--dim);font-weight:400;font-size:12px}
  /* 一行一件事，控件另起一行右对齐。中文字段名很长（「活动关优先任务吃
     理智药数量」），挤在同一行会把输入框压成一条缝。 */
  .row{display:flex;flex-direction:column;gap:8px;padding:13px 15px;
       border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row label{font-size:15px;line-height:1.35}
  .row .hint{display:block;color:var(--dim);font-size:12px;margin-top:3px;
             line-height:1.45}
  .row > :not(label){align-self:flex-end}
  .row input[type=text],.row input[type=number],.row select{width:100%;max-width:100%;
       text-align:left;padding:11px 12px;font-size:16px}
  input[type=text],input[type=number],select{
    background:var(--field);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:15px;width:130px;text-align:right}
  select{width:auto;min-width:130px;text-align:left}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .sw{position:relative;width:50px;height:29px;flex:none}
  .sw input{opacity:0;width:100%;height:100%;margin:0}
  .sw span{position:absolute;inset:0;background:color-mix(in srgb, var(--ink) 22%, transparent);border-radius:99px;transition:.18s;pointer-events:none}
  .sw span::after{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;
                  background:#fff;border-radius:50%;transition:.18s}
  .sw input:checked + span{background:var(--ok)}
  .sw input:checked + span::after{transform:translateX(21px)}
  .changed{background:rgba(74,163,255,.09)}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 15px}
  button{font:inherit;border:0;border-radius:11px;padding:13px;color:var(--ink);
         background:var(--btn);cursor:pointer;box-shadow:var(--sh)}
  button:active{transform:scale(.985)}
  button.primary{background:var(--accent);color:#06121f;font-weight:600}
  button.wide{grid-column:1/-1}
  button[disabled]{opacity:.45}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
           background:color-mix(in srgb, var(--bg) 96%, transparent);border-top:1px solid var(--line);
           display:flex;gap:10px;align-items:center;transform:translateY(120%);transition:.2s}
  .savebar.show{transform:none}
  .savebar .n{flex:1;color:var(--dim);font-size:13px}
  pre{margin:0;padding:13px 15px;white-space:pre-wrap;font-size:13px;color:var(--dim);
      font-family:ui-monospace,Menlo,Consolas,monospace}
  dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);
         border-radius:var(--r);padding:0;width:min(92vw,460px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-b{padding:14px 16px;max-height:52vh;overflow:auto}
  .diff{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
  .diff:last-child{border-bottom:0}
  .diff b{font-weight:600}
  .old{color:var(--dim);text-decoration:line-through}
  .new{color:var(--ok)}
  .toast{position:fixed;left:12px;right:12px;bottom:96px;z-index:9;background:var(--card);
         border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;
         opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .setup{padding:15px}
  .setup input{width:100%;text-align:left;margin-top:6px}
  .ro{color:var(--dim);font-size:14px}
  .swatches{display:flex;gap:9px}
  .sw-c{width:28px;height:28px;border-radius:50%;display:block;cursor:pointer;
        border:2px solid transparent;box-shadow:0 0 0 1px var(--line) inset}
  .sw-c.on{border-color:var(--ink);transform:scale(1.08)}
</style>
</head>
<body>
<header>
  <h1>游戏机遥控</h1>
  <div class="sub"><i class="dot" id="dot"></i><span id="status">正在读取…</span></div>
</header>

<main id="app"></main>

<div class="savebar" id="savebar">
  <span class="n" id="savenote"></span>
  <button id="discard">放弃</button>
  <button class="primary" id="save">保存修改</button>
</div>

<dialog id="confirm">
  <h2>确认这次修改</h2>
  <div class="dlg-b" id="difflist"></div>
  <div class="acts">
    <button id="cancel">再想想</button>
    <button class="primary" id="go">确认修改</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<script src="app.js?v=20260831084233"></script>
</body>
</html>
