<script>/* 诊断记录 (手机 tab switch, localStorage ark-diag = 1): the page starts on the ?diag path — the URL is rewritten before any other script reads it, so the
   frame recorder (seg-frames-logger.js, query-gated) and the diag line load exactly as with ?diag typed (a home-screen window has no address bar). */

     gaussianBlur / vibrantColorMatrix have no exact CSS twin; the nearest mapping used below is
     backdrop-filter: blur(inputRadius) saturate(matrix diagonal) plus an overlay whose alpha is the
     matrix's additive e-column (white for +e, black for −e). Every number is a --ios-* token. */
  :root{

       measured over flat backdrops (out = .495·S(1.94)·D + .538 light; .653·S(1.73)·D + .135 dark) → saturate · brightness in the filter + a white overlay */
    --glass-filter:blur(calc(var(--ios-glass-blur) / .5)) saturate(var(--ios-glass-saturate));   /* platter / glass buttons: blur 10 = 5 ÷ scale .5 ← ⑨；饱和 1.2 / 叠白 .147 仍是层矩阵值（平台没做端到端实测） */

    --alert-fill:rgb(255 255 255 / var(--ios-alert-glass-white));                              /* .538 light / .135 dark ← ⑨ 端到端 */

  /* Page switcher: the iOS 26/27 floating glass tab bar - a capsule at the
     bottom, translucent with blur and a specular edge, the selected tab a
     brighter capsule inside it. (The top segmented control was the pre-26 idiom.) */
  /* Tab bar from the iOS 27 UI kit (Tab Bar - iPhone / _Tab Bar Button - iPhone):
     glass capsule 62pt high with 4pt inset, buttons ≥72×54 with 8/6/7 padding, a
     28pt symbol line and a 10pt semibold label, selected = #ededed capsule + tint,
     unselected label #1a1a1a (light) / #f5f5f5 (dark); 25pt above the home indicator. */
  nav.tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);
           z-index:6;margin:0;padding:0;display:flex;width:max-content;max-width:calc(100% - 24px)}   /* left:50% 会把 shrink-to-fit 宽压到半屏，按钮能缩以后要写死 max-content */
  nav.tabs[hidden]{display:none}
  html.kbd nav.tabs{display:none}   /* keyboard up (view.js: visual viewport > 120 px shorter than the window): the native tab bar is covered by the keyboard; iOS would float a fixed capsule above it (数据 181053 ⑤1) */
  /* As a Home Screen web app there is no Safari bar: the capsule sits where Health's
     does, 22pt above the screen's bottom edge (measured on the iOS 27 simulator). */
  @media (display-mode: standalone){ nav.tabs{bottom:var(--ios-tab-capsule-bottom)} }   /* 胶囊距屏底 21 ← 探针 UITabBar 平台 y 873 / 956 */
  /* Three layers, siblings on purpose: platter (.plat, glass) → selection lens (.glide) → buttons (.seg). A backdrop-filter element is a
     backdrop root, so a lens nested inside the platter would only see the platter's own translucent fill (headless Chrome: 251 instead of
     the matrix's 236; simulator Safari: the overlay variant painted opaque). As a sibling it filters the platter's rendering, as UIKit's
     _UITabSelectionView sits above the platter. */
  nav.tabs .plat{position:absolute;inset:0;border-radius:999px;background:var(--glass-fill);
                 backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);   /* 平台玻璃 = --ios-glass-blur 5 / -saturate 1.2 / -lift .147 ← 探针 deep（UITabBar 平台 = glass 配方） */
                 box-shadow:var(--glass-diffuse),var(--glass-rim)}   /* 阴影/描边 = SDF diffuse 8 / .15 与 highlight .5 的最近 CSS ← 探针 deep */
  nav.tabs .seg{position:relative;z-index:2;display:flex;gap:0;min-width:0;max-width:100%;padding:var(--ios-tab-button-pad);height:var(--ios-tab-capsule-h);border-radius:999px;background:transparent;
                touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}   /* 标签栏自己接管触摸：竖向滑出 450 pt 抬手仍选中（spec §2 T7–T16），没有滚动/长按接管 */   /* 胶囊 62、内缩 4 ← 探针 UITabBar 平台 274×62（83 是含 home 指示区的整个 frame） */
  nav.tabs .glide{position:absolute;z-index:1;top:var(--ios-tab-button-pad);bottom:var(--ios-tab-button-pad);left:var(--ios-tab-button-pad);width:0;border-radius:999px;

  nav.tabs .glide.lift{scale:var(--tab-lift-sx) var(--tab-lift-sy)}   /* 按下未选中项 +140 ms 抬起 94×54 → 119×64（--ios-touch-tab-lift-w/-h）← spec §2 T1 */

  nav.tabs.drag .glide.lift-sel{scale:var(--tab-drag-lift-sx) var(--tab-drag-lift-sy)}   /* 拖动中 110×70 ← T4（--ios-touch-tab-drag-lift-w/-h） */

     e ∈ (1, 1 + fw/2) ≈ 7/255 vs coverage AA ≈ 9/255 one pixel inside the arc — recorded; the difference of the three passes to the measured dark edge
     row (44.3 vs 45.3) stays recorded as unread, not patched. Engine fact: the white plus-lighter stack clamps
     the SUM at 255 where the native clamps V(b) = min(255, .9118·b + 37.5) before the α mix — the two agree for backdrops ≤ .9354·255 (238.5)
     and differ only on brighter ones, i.e. the page rows under the bottom light line (642–645): +1.1 / +1.6 / +1.1 / +2.7 over predict-seg-hold
     §1; the exact form would be one backdrop-filter: contrast(.756) brightness(1.206) (= V with its clamp) per ring under opacity α — 13
     backdrop filters, not done (监督局 2026-09-19). B6-c §4b: the main band is drawn on the two straight runs only (predict-seg-hold.md §6.1 rows 5–6 —
     the native arc rows 603–605 at x_arc + .5 carry no lightening, the corner outside the capsule is page; keyfill §0a item 2 withdrawn): two <line>
     per ring, x ∈ [R, W − R], plain colour; the diffuse tail stays a full ring under the first ring's angular ratio (cos .6155: gone at 52°; the
     deeper rings fall off faster than this — ≤ 2 levels on the arcs). The dark theme needs no separate
     values: the same map on B = 0 gives .1471·α → 45.3 at the edge row, 10.0 at 603 (§3 table). */

  /* Pending edits: the nav bar takes over the way an edit sheet does. Measured on

<body>
<!-- The compact bar a large title collapses into (UINavigationBar): glass, the
     title small and centred; shown once the large title has scrolled away. -->
<div class="topbar" id="topbar"><button type="button" class="navbtn" id="discard" aria-label="放弃"></button><span>游戏机遥控</span><button type="button" class="navbtn" id="save" aria-label="完成"></button></div>
<div class="ptr" id="ptr" aria-hidden="true"><span class="ai" id="ptrai"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
<header>
  <h1>游戏机遥控</h1>
  <div class="sub"><i class="dot" id="dot"></i><span id="status">正在读取…</span></div>
</header>

<nav class="tabs" id="tabs" hidden></nav>
<div id="pendbar" hidden></div>
<main id="app"></main>


<dialog id="confirm">
  <div class="pane"></div>
  <h2>确认这次修改</h2>
  <div class="dlg-b" id="difflist"></div>
  <div class="acts">
    <button id="cancel">再想想</button>
    <button class="primary" id="go">确认修改</button>
  </div>
</dialog>

<!-- 确认弹窗（UIAlertController 320×172 的形；数字 tokens --ios-alert-*）：停止一切 / 现在跑一趟 用它，不再用系统 confirm() -->
<dialog id="alert">
  <div class="pane"></div>
  <h2 id="alert-t"></h2>
  <div class="dlg-b" id="alert-m"></div>
  <div class="acts"><button type="button" id="alert-cancel">取消</button><button type="button" id="alert-ok" class="primary">好</button></div>
</dialog>

<div class="toast" id="toast"></div>
<!-- 诊断记录 sheet (view.js showDiagSheet): shown when seg-frames-logger.js has written a record — copy / share the JSON so the phone's record reaches us -->
<div class="diagsheet" id="diagsheet" hidden role="dialog" aria-modal="true" aria-labelledby="diagsheet-t">
  <div class="dsbox"><h2 id="diagsheet-t">诊断记录已生成</h2><p class="dsmsg" id="diagsheet-m"></p>
    <div class="acts"><button type="button" class="primary" id="diagsheet-copy">复制</button><button type="button" id="diagsheet-share">分享</button><button type="button" id="diagsheet-close">关闭</button></div></div>
</div>
<!-- 勾选页（多选 38 / 单选 37b）：值行「已选 N/M ›」点开；表 y 62 起、导航 54 在 +20、返回 44 at 20、完成 36 at 380 ← AX-38 -->
<div class="sheet" id="picker" role="dialog" aria-modal="true">
  <div class="dim"></div>
  <div class="card">
    <div class="pnav"><button type="button" class="navbtn pback" aria-label="返回"></button><span class="ptitle"></span><button type="button" class="pdone" aria-label="完成"></button></div>
    <div class="plist"></div>
