<!-- 组件数字的正本：--ios-* 变量，每条带来源（探针原值 / AX 帧 / NUMBERS 行 / 取色 / 采样替代）。页面自己的变量只做映射，不再手写数字。 -->
<link rel="stylesheet" href="tokens.css?v=20260918123501">
<style>
  /* iOS Settings, copied not approximated (the user, 2026-09-14: 「这是真的要在 iOS
     上面跑的」). System colours from Apple's palette: grouped background, white
     inset cards, hairline separators inset to the text, secondary grey text,
     green switches, blue tint. Dark mode uses the same palette's dark values.
     Everything else on the page reuses these tokens; no element carries its own. */
  /* Page variables = aliases of tokens.css (light and dark both come from there).
     Materials (deep probe round, remote-ref/deep-materials.md): CoreAnimation's glassBackground /
     gaussianBlur / vibrantColorMatrix have no exact CSS twin; the nearest mapping used below is
     backdrop-filter: blur(inputRadius) saturate(matrix diagonal) plus an overlay whose alpha is the
     matrix's additive e-column (white for +e, black for −e). Every number is a --ios-* token. */
  :root{
    --bg:var(--ios-grouped-bg); --card:var(--ios-card-bg); --line:var(--ios-separator); --ink:var(--ios-label);
    --dim:var(--ios-secondary-label); --field:var(--ios-tertiary-fill); --btn:var(--ios-card-bg); --sh:none;
    --accent:var(--ios-tint); --link:var(--ios-link); --ok:var(--ios-green); --bad:var(--ios-red);
    --warn:var(--ios-orange);             /* systemOrange (255,141,40) / 暗 (255,146,48) ← 探针色表（tokens.css） */
    --tab:var(--ios-tab-label); --seg:var(--ios-tertiary-fill); --r:var(--ios-card-radius);
    /* glass (alert / glass button / platter): glassBackground inputBlurRadius 5 + vibrantColorMatrix ≈ saturate 1.2, e +0.147 ← 探针 deep（UISDFBackdropView / UISDFView） */
    --glass-filter:blur(var(--ios-glass-blur)) saturate(var(--ios-glass-saturate));
    --glass-fill:rgb(255 255 255 / var(--ios-glass-lift));
    /* selection lens (tab bar / segmented): CABackdropLayer gaussianBlur inputRadius 2 + colorMatrix ≈ saturate 1.19, e −0.2（暗 1.13 / −0.07） ← 探针 deep（_UITabSelectionView） */
    /* 读出的 4×5 矩阵 = 增益·x + e，写进滤镜链本身：contrast(1 − 2e) ∘ brightness(增益 ÷ contrast)（亮 .807 / 1.4，暗 .763 / 1.14），
       2 万随机色对比误差 ≤ .14/255 ← 探针 subtree + tokens.css --ios-lens-filter。不用叠层：WebKit 把 backdrop-filter 单独合成，::after 的 plus-darker 看不到它（模拟器 Safari 实测画成不透明 204） */
    --lens-filter:var(--ios-lens-filter);
    /* SDF rim light: CASDFKeyFillHighlightEffect key/fill amount 0.5, white → the hairline ring; diffuse height 8 / amount 0.15 → the soft shadow ← 探针 deep（tokens.css 注释，无独立变量） */
    --glass-rim:inset 0 0 0 .5px rgb(255 255 255 / var(--ios-glass-highlight-amount));
    --glass-diffuse:0 8px 16px rgb(0 0 0 / .15);
    /* interaction-spec.md §1/§2/§3 values that have no --ios-touch-* token yet: the lens follows a drag with a spring lag of ~100–150 ms (G4: finger 320 → lens 61→237 in ~120 ms);
       the committed lens settles in ~1.2 s while its width goes 196 → 239 → 181 → 196 and height 28 → 38.6 → 27 → 28 (G1/G3); the tab-bar lens lifts 94×54 → 119×64 (T1), the switch knob 37×24 → 60.5×40 then 58×38 (L*) */
    --seg-follow-lag:.12s;
    --seg-settle:1.2s;
    --seg-lift-sx:1.1224; --seg-lift-sy:1.5714;       /* (196 + 2×--ios-touch-segment-lift-x 12) / 196, (28 + 2×--ios-touch-segment-lift-y 8) / 28 */
    --tab-lift-sx:1.266; --tab-lift-sy:1.185;         /* (94 + --ios-touch-tab-lift-w 25) / 94, (54 + --ios-touch-tab-lift-h 10) / 54 */
    --knob-lift-sx:1.635; --knob-lift-sy:1.667;       /* --ios-touch-switch-lift-w 60.5 / 37, -h 40 / 24 (peak) */
    --knob-hold-sx:1.568; --knob-hold-sy:1.583;       /* settled 58 / 37, 38 / 24 (spec L*, Kit Toggle Pressed 58×38) */
    /* alert button fill: white background view + vibrantColorMatrix e −0.12（暗 +0.11） ← 探针 deep */
    --alert-button-fill:rgb(0 0 0 / calc(-1 * var(--ios-alert-button-offset)));
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --alert-button-fill:rgb(255 255 255 / var(--ios-alert-button-offset)); }
  }
  :root[data-theme="dark"]{ --alert-button-fill:rgb(255 255 255 / var(--ios-alert-button-offset)); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Sizes are the probe's px values at the default text size (tokens.css), so the
     page no longer follows Settings › 显示与亮度 › 文字大小 (the old `-apple-system-body`
     em scale). Root = Body 17 so rem/em fallbacks and the acceptance probe agree. */
  html{font-size:var(--ios-body-size);font-family:var(--ios-font)}   /* 根 17 = --ios-body-size；--ios-font ← 探针 .SFUI-* + PingFang 回退 */
  body{margin:0;background:var(--bg);color:var(--ink);
       font-size:var(--ios-body-size);line-height:var(--ios-body-lh);font-family:inherit;   /* 正文 17 / 行框 20.33 ← 探针 */
       padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 120px)}
  /* Large title, like every top-level Settings screen. */
  header{padding:14px 20px 6px}
  h1{margin:0;font-size:var(--ios-large-title-size);line-height:var(--ios-large-title-lh);font-weight:700}   /* Large Title 34/40.57 ← 探针 preferredFont；粗体 ← NUMBERS 56 */
  .sub{color:var(--dim);font-size:var(--ios-sub-size);margin-top:2px;display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok)}
  .dot.off{background:var(--bad)}
  /* Page switcher: the iOS 26/27 floating glass tab bar - a capsule at the
     bottom, translucent with blur and a specular edge, the selected tab a
     brighter capsule inside it. (The top segmented control was the pre-26 idiom.) */
  /* Tab bar from the iOS 27 UI kit (Tab Bar - iPhone / _Tab Bar Button - iPhone):
     glass capsule 62pt high with 4pt inset, buttons ≥72×54 with 8/6/7 padding, a
     28pt symbol line and a 10pt semibold label, selected = #ededed capsule + tint,
     unselected label #1a1a1a (light) / #f5f5f5 (dark); 25pt above the home indicator. */
  nav.tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);
           z-index:6;margin:0;padding:0;display:flex;width:max-content;max-width:calc(100% - 24px)}   /* left:50% 会把 shrink-to-fit 宽压到半屏，按钮能缩以后要写死 max-content */
  nav.tabs[hidden]{display:none}
  /* As a Home Screen web app there is no Safari bar: the capsule sits where Health's
     does, 22pt above the screen's bottom edge (measured on the iOS 27 simulator). */
  @media (display-mode: standalone){ nav.tabs{bottom:var(--ios-tab-capsule-bottom)} }   /* 胶囊距屏底 21 ← 探针 UITabBar 平台 y 873 / 956 */
  /* Three layers, siblings on purpose: platter (.plat, glass) → selection lens (.glide) → buttons (.seg). A backdrop-filter element is a
     backdrop root, so a lens nested inside the platter would only see the platter's own translucent fill (headless Chrome: 251 instead of
     the matrix's 236; simulator Safari: the overlay variant painted opaque). As a sibling it filters the platter's rendering, as UIKit's
     _UITabSelectionView sits above the platter. */
  nav.tabs .plat{position:absolute;inset:0;border-radius:999px;background:var(--glass-fill);
                 backdrop-filter:var(--glass-filter);-webkit-backdrop-filter:var(--glass-filter);   /* 平台玻璃 = --ios-glass-blur 5 / -saturate 1.2 / -lift .147 ← 探针 deep（UITabBar 平台 = glass 配方） */
                 box-shadow:var(--glass-diffuse),var(--glass-rim)}   /* 阴影/描边 = SDF diffuse 8 / .15 与 highlight .5 的最近 CSS ← 探针 deep */
  nav.tabs .seg{position:relative;z-index:2;display:flex;gap:0;min-width:0;max-width:100%;padding:var(--ios-tab-button-pad);height:var(--ios-tab-capsule-h);border-radius:999px;background:transparent;
                touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}   /* 标签栏自己接管触摸：竖向滑出 450 pt 抬手仍选中（spec §2 T7–T16），没有滚动/长按接管 */   /* 胶囊 62、内缩 4 ← 探针 UITabBar 平台 274×62（83 是含 home 指示区的整个 frame） */
  nav.tabs .glide{position:absolute;z-index:1;top:var(--ios-tab-button-pad);bottom:var(--ios-tab-button-pad);left:var(--ios-tab-button-pad);width:0;border-radius:999px;
                  background:transparent;backdrop-filter:var(--lens-filter);-webkit-backdrop-filter:var(--lens-filter);   /* 选中透镜 = _UITabSelectionView gaussianBlur 2 + colorMatrix → --ios-lens-filter（blur 2 · saturate 1.062 · brightness .807 · contrast 1.4；暗 1.379 / .763 / 1.14）← 探针 deep */
                  scale:1 1;transform-origin:center;
                  transition:left var(--ios-motion-lens-duration) var(--ios-motion-lens-easing),width var(--ios-motion-lens-duration) var(--ios-motion-lens-easing),scale .4s var(--ios-motion-lens-easing)}   /* UIViewSpringAnimationBehavior dampingRatio .85 / response .4 s（--ios-motion-lens-response/-damping-ratio）← 探针 deep；采成 0.55 s linear()；落回 ~0.4 s（spec §2 T1） */
  nav.tabs .glide.lift{scale:var(--tab-lift-sx) var(--tab-lift-sy)}   /* 按下 +140 ms 抬起 94×54 → 119×64（--ios-touch-tab-lift-w/-h）← spec §2 T1 */
  nav.tabs.drag .glide{transition:left var(--seg-follow-lag) ease-out,width var(--seg-follow-lag) ease-out,scale .4s var(--ios-motion-lens-easing)}   /* 按住滑动：透镜跟手（spec §2 T4） */
  nav.tabs button{position:relative;width:var(--ios-tab-button-w);flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;
                  height:var(--ios-tab-button-h);padding:6px 8px 7px;border-radius:var(--ios-tab-lens-radius);font-size:var(--ios-tab-label-size);line-height:12px;font-weight:var(--ios-headline-weight);   /* 按钮 94×54 r27、字 Semibold 10 ← 探针（5 个标签放不下 5×94 时等比缩）；6/8/7 待 tokens，但 4 + 6 + 28 + 1 = 39 = --ios-tab-label-top ← 探针 */
                  background:transparent;box-shadow:none;color:var(--tab);white-space:nowrap;transition:color .2s}
  nav.tabs button .ico{display:flex;align-items:center;justify-content:center;width:var(--ios-tab-symbol-box);height:var(--ios-tab-symbol-box);flex:none}   /* 符号框 28 ← 探针 27–31 */
  nav.tabs button .tabimg{display:block;width:26px;height:26px;border-radius:7px;object-fit:cover;
                          opacity:.7;filter:saturate(.6);transition:opacity .2s,filter .2s}
  nav.tabs button.on .tabimg{opacity:1;filter:none}
  nav.tabs button .sf{display:block;width:26px;height:26px;background:currentColor;
                      -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
                      -webkit-mask-size:contain;mask-size:contain}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button:active .ico{transform:scale(.9);transition:transform .1s}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
  }
  main{padding:4px var(--ios-card-inset);margin:0 auto}                 /* 卡片距边 20 ← AX45；不再写死 640 */
  /* A section = a small grey header above an inset group, footers in grey below.
     Every number below was measured on the iOS 26.5 simulator (iPhone 17 Pro Max,
     Simplified Chinese, Settings › 辅助功能 and › 动态效果, 2026-09-15 00:13):
     card margins 20.33, corner 26-27, row 53.33 high, text inset 20 from the card
     edge, separator hairline inset 20 on both sides, toggle 63×28 inset 18,
     header 17pt semibold secondary 28 above / 6 below, footer 13pt 6 below the
     card and 24 above the next one. */
  section{margin:0}
  section + section > .group:first-child{margin-top:35px}                        /* 卡到卡 35：Kit L44，待 tokens */
  section:has(> .foot:last-child) + section > .group:first-child{margin-top:0}   /* the footer's 24 is the gap */
  h2{margin:0;padding:var(--ios-header-text-top) var(--ios-row-text-x) calc(var(--ios-header-h) - var(--ios-header-text-top) - var(--ios-body-lh));font-size:var(--ios-body-size);line-height:var(--ios-body-lh);font-weight:var(--ios-headline-weight);color:var(--dim);   /* 组头容器 45.33、文字 +18.67 ← 探针 */
     text-transform:none;display:flex;justify-content:space-between;align-items:baseline}
  section:has(> .foot:last-child) + section > h2{padding-top:4px}
  section:first-child > h2{padding-top:10px}
  h2 small{color:var(--dim);font-weight:400;font-size:var(--ios-footnote-size)}
  /* Group footer: the explanation under a card, 13pt secondary (UITableView footer). */
  .foot{margin:0;padding:var(--ios-footer-text-top) var(--ios-row-text-x) calc(var(--ios-footer-h) - var(--ios-footer-text-top) - var(--ios-footnote-lh) + var(--ios-group-gap));color:var(--dim);font-size:var(--ios-footnote-size);line-height:var(--ios-footnote-lh)}   /* 脚注 13/15.67，容器 30.33 文字 +7.67，到下一组 17.67 ← 探针/AX45 */
  /* Large title → compact bar on scroll (Settings, Health). Driven by scroll
     position, not a switch: the bar's glass appears as soon as content slides
     under it, and the small title fades in exactly as the large one crosses it
     (--bar for the glass, --title for the label; app.js sets both). */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:5;height:calc(env(safe-area-inset-top) + var(--ios-nav-h));   /* 栏 54 ← AX-45 NavigationBar (0,62,440,54)；44 只是圆钮 */
          padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;
          font-size:var(--ios-body-size);font-weight:var(--ios-headline-weight);pointer-events:none;
          background:rgb(255 255 255 / calc(var(--bar, 0) * var(--ios-glass-lift)));   /* 滚动后 = glass 配方按 --bar 淡入（探针 deep：NavigationBarTransitionContainer 静止时 blur 0；滚动态未测，取 glass 原值为最近） */
          backdrop-filter:blur(calc(var(--bar, 0) * var(--ios-glass-blur))) saturate(calc(1 + var(--bar, 0) * (var(--ios-glass-saturate) - 1)));
          -webkit-backdrop-filter:blur(calc(var(--bar, 0) * var(--ios-glass-blur))) saturate(calc(1 + var(--bar, 0) * (var(--ios-glass-saturate) - 1)))}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--ios-separator-h);background:var(--line);opacity:var(--bar, 0)}
  .topbar span{opacity:var(--title, 0);transform:translateY(calc((1 - var(--title, 0)) * 6px))}
  header h1{opacity:calc(1 - var(--big, 0))}
  /* Pull to refresh: UIActivityIndicatorView - eight bars fading in turn. It grows
     with the pull and spins once released. */
  .ptr{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:4;
       opacity:0;transform:scale(.3);transition:opacity .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
  .ptr.arm{opacity:1;transform:scale(1)}
  .ptr.go{opacity:1;transform:scale(1)}
  .ai{position:relative;width:var(--ios-spinner-size);height:var(--ios-spinner-size);display:inline-block}   /* 20 ← 探针 UIActivityIndicatorView */
  .ai i{position:absolute;left:8.5px;top:0;width:3px;height:7px;border-radius:1.5px;background:var(--ios-spinner);transform-origin:1.5px 10px;opacity:.25}   /* 条 7×3 r1.5 ← Kit dump Progress Indicators；色 secondaryLabel ← 探针 */
  .ai i:nth-child(1){transform:rotate(0deg)}   .ai i:nth-child(2){transform:rotate(45deg)}
  .ai i:nth-child(3){transform:rotate(90deg)}  .ai i:nth-child(4){transform:rotate(135deg)}
  .ai i:nth-child(5){transform:rotate(180deg)} .ai i:nth-child(6){transform:rotate(225deg)}
  .ai i:nth-child(7){transform:rotate(270deg)} .ai i:nth-child(8){transform:rotate(315deg)}
  .ai.on i{animation:aifade var(--ios-motion-spinner-period) linear infinite}   /* 0.8 s ← 探针 UIActivityIndicatorView */
  .ai.on i:nth-child(2){animation-delay:-.7s} .ai.on i:nth-child(3){animation-delay:-.6s}
  .ai.on i:nth-child(4){animation-delay:-.5s} .ai.on i:nth-child(5){animation-delay:-.4s}
  .ai.on i:nth-child(6){animation-delay:-.3s} .ai.on i:nth-child(7){animation-delay:-.2s}
  .ai.on i:nth-child(8){animation-delay:-.1s}
  @keyframes aifade{0%{opacity:1}100%{opacity:.25}}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* The refresh tile shows the activity indicator in place of its symbol while the machine is being asked. */
  .tile .tico .ai{display:none}
  .tile.busy .tico .sf{display:none}
  .tile.busy .tico .ai{display:inline-block}
  .tile.busy .tico .ai i{background:#fff}
  /* Notice cards come and go with the system's short fade+rise. */
  .group.notice{animation:rise .28s cubic-bezier(.2,.8,.2,1)}   /* 无来源（老页自定），待 tokens */
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tile{transition:background var(--ios-motion-button-release-duration) var(--ios-motion-ease-in-out)}   /* 松开 0.25 s ease-in-out ← 探针 UIButton；按下瞬时（下面 :active 关掉过渡） */
  .tile:active{transform:scale(.97)}
  /* Number tiles: Reminders' smart-list tiles (2×2, 195.67×80.33 on the Pro Max,
     radius 16, gap 8): symbol top-left, big number top-right, name bottom-left. */
  .group.nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--ios-tile-gap);background:transparent;border-radius:0;overflow:visible}   /* 两列 196 间距 8 ← AX-57 提醒事项磁贴 */
  .group.nums > .num:last-child:nth-child(odd){grid-column:1 / -1}   /* 奇数张时最后一张占满一行（提醒事项首页奇数张智能列表的排法） */
  section + section > .group.nums:first-child{margin-top:16px}
  .group.nums + .foot{padding-top:8px}
  /* Reminders smart-list tile, ORIGINAL (deep round ⑦, injected dump of com.apple.reminders): 196×80.33 r16 continuous; badge 48 at (6,2);
     number .SFUIRounded-Bold 28 / 33.67 at y 9, right edge − 10; label .SFUIRounded-Semibold 17 / 20.33 at (12,52). The card stays white with the
     resource's coloured circle (the 09-15 decision: tab = game, tile = resource); the 回满 footnote is ours - Reminders has no third line, so a tile
     with one grows past 80.33 (bottom pad 8 = 80.33 − 52 − 20.33 keeps the bare tile at 80.33). */
  .num{position:relative;min-height:var(--ios-tile-h);padding:var(--ios-tile-label-top) var(--ios-tile-number-inset) calc(var(--ios-tile-h) - var(--ios-tile-label-top) - var(--ios-tile-label-lh)) var(--ios-tile-label-x);
       border-radius:var(--ios-tile-radius);background:var(--card);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-start}
  .nico{position:absolute;left:var(--ios-tile-icon-x);top:var(--ios-tile-icon-y);width:var(--ios-tile-icon);height:var(--ios-tile-icon);border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}   /* 徽章 48 at (6,2) ← 提醒事项 TTRListBadgeView */
  .nico .sf{width:var(--ios-symbol-slot);height:var(--ios-symbol-slot);background:#fff}   /* 符号槽 22 ← Kit */
  .nico .rico{width:36px;height:36px;object-fit:contain;display:block}   /* 资源图 36 = 老比例 24/32 × 48，待 tokens（徽章里的图 64 是提醒事项自己的位图） */
  .num .big{position:absolute;top:var(--ios-tile-number-top);right:var(--ios-tile-number-inset);font-family:var(--ios-tile-number-font);font-size:var(--ios-tile-number-size);line-height:var(--ios-tile-number-lh);font-weight:var(--ios-tile-number-weight);letter-spacing:0;color:var(--ink)}   /* 数字 Rounded Bold 28/33.67，顶 9 右缩 10 ← 提醒事项 UILabel */
  .num .big small{font-size:.58em;font-weight:600;color:var(--dim)}   /* 上限后缀：我们加的，.58em 待 tokens */
  .num .lab{margin:0;font-family:var(--ios-tile-number-font);font-size:var(--ios-tile-label-size);line-height:var(--ios-tile-label-lh);font-weight:var(--ios-tile-label-weight);color:var(--ink)}   /* 标签 Rounded Semibold 17/20.33 at (12,52) ← 提醒事项 UILabel；原件白字在色底，这里白卡上取 label 色 */
  .num .sub{font-size:var(--ios-footnote-size);line-height:var(--ios-footnote-lh);color:var(--dim)}
  .num.err .sub{color:var(--bad)}
  /* ---- 状态页的三种块（docs/PHONE-NATIVE-REFERENCES.md） ---- */
