<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>游戏机遥控</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#0f1216; --card:#171c22; --line:#242c35; --ink:#e6edf3;
    --dim:#8b98a5; --accent:#4aa3ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
       padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px)}
  header{position:sticky;top:0;z-index:5;background:rgba(15,18,22,.94);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
  h1{margin:0;font-size:19px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px;margin-top:3px;display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--bad)}
  main{padding:14px 12px;max-width:640px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
          margin-bottom:12px;overflow:hidden}
  h2{margin:0;padding:13px 15px;font-size:15px;border-bottom:1px solid var(--line);
     display:flex;justify-content:space-between;align-items:center}
  h2 small{color:var(--dim);font-weight:400;font-size:12px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row label{flex:1;min-width:0;font-size:14px}
  .row .hint{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  input[type=text],input[type=number],select{
    background:#0d1117;border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:15px;width:130px;text-align:right}
  select{width:auto;min-width:130px;text-align:left}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .sw{position:relative;width:50px;height:29px;flex:none}
  .sw input{opacity:0;width:100%;height:100%;margin:0}
  .sw span{position:absolute;inset:0;background:#2b333c;border-radius:99px;transition:.18s;pointer-events:none}
  .sw span::after{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;
                  background:#fff;border-radius:50%;transition:.18s}
  .sw input:checked + span{background:var(--ok)}
  .sw input:checked + span::after{transform:translateX(21px)}
  .changed{background:rgba(74,163,255,.09)}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px 15px}
  button{font:inherit;border:0;border-radius:11px;padding:13px;color:var(--ink);
         background:#232b34;cursor:pointer}
  button:active{transform:scale(.985)}
  button.primary{background:var(--accent);color:#06121f;font-weight:600}
  button.wide{grid-column:1/-1}
  button[disabled]{opacity:.45}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
           background:rgba(15,18,22,.96);border-top:1px solid var(--line);
           display:flex;gap:10px;align-items:center;transform:translateY(120%);transition:.2s}
  .savebar.show{transform:none}
  .savebar .n{flex:1;color:var(--dim);font-size:13px}
  pre{margin:0;padding:13px 15px;white-space:pre-wrap;font-size:13px;color:var(--dim);
      font-family:ui-monospace,Menlo,Consolas,monospace}
  dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);
         border-radius:var(--r);padding:0;width:min(92vw,460px)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-b{padding:14px 16px;max-height:52vh;overflow:auto}
  .diff{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
  .diff:last-child{border-bottom:0}
  .diff b{font-weight:600}
  .old{color:var(--dim);text-decoration:line-through}
  .new{color:var(--ok)}
  .toast{position:fixed;left:12px;right:12px;bottom:96px;z-index:9;background:#1f2933;
         border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;
         opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .setup{padding:15px}
  .setup input{width:100%;text-align:left;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>游戏机遥控</h1>
  <div class="sub"><i class="dot" id="dot"></i><span id="status">正在读取…</span></div>
</header>

<main id="app"></main>

<div class="savebar" id="savebar">
  <span class="n" id="savenote"></span>
  <button id="discard">放弃</button>
  <button class="primary" id="save">保存修改</button>
</div>

<dialog id="confirm">
  <h2>确认这次修改</h2>
  <div class="dlg-b" id="difflist"></div>
  <div class="acts">
    <button id="cancel">再想想</button>
    <button class="primary" id="go">确认修改</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
