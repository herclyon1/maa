<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>透镜折射测试</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="透镜">
<style>
  /* Minimal test page for the lifted segmented-control lens (220×44, ?w=<width> for a drag-stretch set) with the formula filters of
     lens-filter.svg (map files seg-f-*.png next to this page; index.html references them as assets/lens/…).
     Metrics of the row: tokens.css (segmented control 32 r16, lens 28 r14 pad 2, label 13; lifted lens 220×44 = 196×28 + 12/8 each side). */
  :root{--bg:rgb(242 242 247);--card:#fff;--ink:#000;--dim:rgb(60 60 67 / .6);--track:rgb(118 118 128 / .12);--tint:rgb(0 136 255)}
  @media (prefers-color-scheme: dark){:root{--bg:#000;--card:rgb(28 28 30);--ink:#fff;--dim:rgb(235 235 245 / .6);--track:rgb(118 118 128 / .24);--tint:rgb(0 145 255)}}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/20.33px -apple-system,"SF Pro Text","PingFang SC",sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
  body{padding:calc(env(safe-area-inset-top) + 20px) 20px 20px}
  h1{font-size:34px;line-height:40.57px;font-weight:700;margin:0 0 12px}
  .scene{position:relative;width:400px;background:var(--card);border-radius:26px;padding:16px 20px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
  .scene.grating{background:repeating-linear-gradient(90deg,rgb(51 51 51) 0 1px,rgb(204 204 204) 4px 5px,rgb(51 51 51) 8px)}   /* period 8 pt like the native measurement (pattern gx 8) */
  .scene.gratingy{background:repeating-linear-gradient(0deg,rgb(51 51 51) 0 1px,rgb(204 204 204) 4px 5px,rgb(51 51 51) 8px)}
  .scene.bars{background:repeating-linear-gradient(90deg,#000 0 4px,#fff 4px 8px)}                                              /* ?pattern=bars: hard black / white bars, period 8 (the data session's `pattern bars 8`) for the per-channel edge check */
  .scene p{margin:0 0 8px}
  .segctl{position:relative;display:flex;height:32px;padding:2px;border-radius:16px;background:var(--track);box-sizing:border-box;margin:8px 0}
  .segctl .flat{position:absolute;top:2px;left:2px;width:calc(50% - 2px);height:28px;border-radius:14px;background:var(--card)}   /* the resting selected segment: flat _controlForegroundColor platter */
  .segctl span{position:relative;z-index:1;flex:1 1 0;height:28px;line-height:28px;text-align:center;font-size:13px}
  .segctl span.on{font-weight:500}
  /* the lens: a w×h window (220×44 lifted at rest; ?w=<width> picks a drag-stretch set, height from the series table) over two clones
     of the scene — the filtered copy of what lies under the lens and the filtered label copy — both shifted by −(lens position) */
  .lens{position:absolute;z-index:2;width:220px;height:44px;border-radius:22px;overflow:hidden;touch-action:none;cursor:grab;   /* above the labels (they carry z-index 1) */
        box-shadow:inset 0 0 0 1px rgb(255 255 255 / .126), 0 0 0 1px rgb(0 0 0 / .23)}   /* rim: 1 pt bright line inside (+16/255 on 128 grey) + 1 pt dark line outside (−30/255) ← lens-refraction.md §3 rim.json; no highlight ring */
  /* each layer is the lens box (overflow hidden: its bounding box is its border box in every engine) holding a 400-wide copy of the
     card shifted by −(lens position). The map's samples never leave the box (clamp_to_edge is baked into the map, formula.md §2),
     the map's B channel masks the output. The label layer is clipped to the capsule BEFORE the filter (the native portal #20 clips
     the segment content with r 22, then ClearGlass displaces: 先裁再位移); the copy of what lies under the lens keeps the box */
  .lens .layer{position:absolute;left:0;top:0;width:220px;height:44px;overflow:hidden}
  .lens .layer.lab{border-radius:22px}
  /* the colour fringe: glassForeground's 7-tap spectral sampling over what lies below it (the two displaced layers) — the chain
     filter sits on their wrapper (?ab=flip: outer band; ?ab=ir: IR-literal interior mask; ?ab=0: off) */
  .lens .stack{position:absolute;left:-16px;top:-16px;width:252px;height:76px;overflow:hidden}   /* the lens box + 16 pt: the chain's outward taps read the page beyond the lens (base copy) */
  .lens .stack .base{position:absolute;left:0;top:0;width:400px;pointer-events:none;z-index:0}   /* plain copy of the page (track + labels) under the two displaced layers; its own stacking context: the copied labels carry z-index 1 and would otherwise paint above the layers */
  .lens .stack .base .scene{border-radius:0}
  .lens .stack .base .flat{display:none}
  .lens .stack .layer{left:16px;top:16px}
  .lens.ab-flip .stack{filter:url(#seg-lens-f-ab-220)}
  .lens.ab-ir .stack{filter:url(#seg-lens-f-ab-ir-220)}
  .lens.f-seg .layer.bg{filter:url(#seg-lens-f-bg-220)}
  .lens.f-seg .layer.lab{filter:url(#seg-lens-f-lab-220)}
  .lens .clone,.lens .labels{position:absolute;left:0;top:0;width:400px;pointer-events:none}
  .lens .clone .scene{border-radius:0}
  .lens .clone .flat,.scene.lifted > .segctl .flat{display:none}   /* lifted: the flat resting platter IS the lens, so neither the copy nor the scene shows it */
  .lens .clone .segctl span{visibility:hidden}                   /* the filtered copy carries the track, not the labels */
  .lens .labels .scene{background:transparent}
  .lens .labels .scene > *:not(.segctl){visibility:hidden}       /* only the segment labels, on a transparent layer */
  .lens .labels .segctl{background:transparent}
  .lens .labels .segctl .flat{display:none}
  .lens.nobg .layer.bg,.lens.nolab .layer.lab{filter:none}       /* ?bg=0 / ?lab=0: that layer unfiltered */
  body.native .scene{padding-left:0;padding-right:0}             /* ?native=1: the control spans x 20…420 like the native probe (segment centres 120 / 320) */
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  button{font:inherit;font-size:15px;line-height:18px;padding:6px 12px;border:0;border-radius:15px;background:rgb(0 136 255 / .18);color:var(--tint)}
  button.on{background:var(--tint);color:#fff}
  #stats{font-size:13px;line-height:15.67px;color:var(--dim);white-space:pre-wrap;font-variant-numeric:tabular-nums}
  #stats b{color:var(--ink)}
</style>
</head>

       extended size (w+0 × h+0, overflow hidden, placed at −0/−0 inside the lens which clips it to
       the capsule). THE SOURCE MUST EXTEND PAST THE LENS — with the layer equal to the lens box the outward sampling at the edges
       reads transparent and one-pixel coloured lines appear along the long edges (README §0.3). userSpaceOnUse regions and
       feImage subregions are not used: WebKit renders nothing with them, and it takes an overflowing child into the
       objectBoundingBox region. No dispersion in these maps (the colour

<h1>透镜折射</h1>
<div class="scene" id="scene">
  <p>状态是 3 分钟前的 · 早班 09:00 东京 10:00</p>
  <div class="segctl"><i class="flat"></i><span class="on">早班</span><span>晚班</span></div>
  <p>明日方舟 理智 1-7（固定），理智药 0 瓶 · 终末地 基质刷取 双倍</p>
</div>
<div class="bar">
  <button data-f="f-seg" class="on">折射贴图</button><button data-f="">无滤镜</button>
  <button id="auto">自动拖 2 s</button><button id="grat">光栅 ↔</button><button id="graty">光栅 ↕</button>
</div>
<div id="stats">拖动透镜或点「自动拖 2 s」。帧间隔在这里显示。</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("native") === "1") document.body.classList.add("native");
  if (q.get("pattern") === "bars") document.getElementById("scene").classList.add("bars");
  const SERIES = {"196": 48.6, "198": 48.48, "200": 47.99, "202": 47.59, "204": 47.51, "206": 47.23, "208": 46.83, "210": 46.39, "212": 45.93, "214": 45.45, "216": 44.98, "218": 44.49, "220": 44.0, "222": 43.53, "224": 42.96, "226": 42.53, "228": 41.89, "230": 41.58, "232": 41.12, "234": 40.65, "236": 40.18, "238": 39.8, "240": 39.3, "242": 38.84, "244": 38.36, "246": 37.92, "248": 37.49, "250": 37.05, "252": 36.56, "254": 36.2, "256": 36.2};                                     /* lens width → height of the drag-stretch sets (lens-field.json) */
  const LW = parseInt(q.get("w") || "220", 10), LH = SERIES[String(LW)] || 44;
  const scene = document.getElementById("scene"), stats = document.getElementById("stats");
  const lens = document.createElement("div"); lens.className = "lens f-seg";
  if (q.get("bg") === "0") lens.classList.add("nobg"); if (q.get("lab") === "0") lens.classList.add("nolab");
  lens.style.width = LW + "px"; lens.style.height = LH + "px"; lens.style.borderRadius = Math.min(22, LH / 2) + "px";
  const bgLayer = document.createElement("div"); bgLayer.className = "layer bg"; const clone = document.createElement("div"); clone.className = "clone"; bgLayer.appendChild(clone);
  const labLayer = document.createElement("div"); labLayer.className = "layer lab"; const labels = document.createElement("div"); labels.className = "labels"; labLayer.appendChild(labels);
  const M = 0;                                                   /* no extension: the map's samples stay inside the box */
  for (const l of [bgLayer, labLayer]) { l.style.width = LW + "px"; l.style.height = LH + "px"; }
  labLayer.style.borderRadius = Math.min(22, LH / 2) + "px";
  if (LW !== 220) { if (!lens.classList.contains("nobg")) bgLayer.style.filter = `url(#seg-lens-f-bg-${LW})`; if (!lens.classList.contains("nolab")) labLayer.style.filter = `url(#seg-lens-f-lab-${LW})`; }
  const AM = 16;                                                 /* the wrapper's extension beyond the lens (lens-field.json aberration.wrapper) */
  const stack = document.createElement("div"); stack.className = "stack"; stack.style.width = (LW + 2 * AM) + "px"; stack.style.height = (LH + 2 * AM) + "px";
  const base = document.createElement("div"); base.className = "base";
  stack.appendChild(base); stack.appendChild(bgLayer); stack.appendChild(labLayer); lens.appendChild(stack); scene.appendChild(lens);
  const AB = q.get("ab") || "flip";                              /* colour fringe chain: flip (outer band, default) | ir | 0 */
  if (AB === "flip" || AB === "ir") { lens.classList.add("ab-" + AB); if (LW !== 220) stack.style.filter = `url(#seg-lens-f-ab${AB === "ir" ? "-ir" : ""}-${LW})`; }
  scene.classList.add("lifted");
  const copy = () => { const c = scene.cloneNode(true); c.querySelector(".lens").remove(); c.id = ""; return c; };
  const sync = () => { clone.innerHTML = ""; clone.appendChild(copy()); labels.innerHTML = ""; labels.appendChild(copy()); base.innerHTML = ""; base.appendChild(copy()); };
  sync();
  /* lens position inside the scene (pt); starts over the selected segment: segctl at (20, 16 + 20.33 + 8) → segment centre */
  const seg = scene.querySelector(".segctl"), r0 = seg.getBoundingClientRect(), s0 = scene.getBoundingClientRect();
  let X = r0.left - s0.left + 2 + (r0.width - 4) / 4 - LW / 2, Y = r0.top - s0.top + 16 - LH / 2;
  if (q.get("lensx")) X = parseFloat(q.get("lensx")) - s0.left - LW / 2;             // ?lensx=<page x of the lens centre>, e.g. 220 = the divider
  /* the clone is placed so that the scene point under the lens centre stays under the lens centre; with zoom z the clone's own
     coordinates are scaled about its top-left, so its offset is (centre − z·(lens position + centre)) / z in zoomed units */
  const place = () => { lens.style.left = X + "px"; lens.style.top = Y + "px"; for (const l of [clone, labels]) { l.style.left = (M - X) + "px"; l.style.top = (M - Y) + "px"; } base.style.left = (AM - X) + "px"; base.style.top = (AM - Y) + "px"; };
  place();
  /* drag: pointer events, no threshold; the frame interval is measured while a finger is down or the auto drag runs */
  let dragging = null, times = [];
  const tick = (t) => { times.push(t); if (dragging || auto.running) requestAnimationFrame(tick); else report("拖动"); };
  const report = (what) => {
    if (times.length < 3) return;
    const d = []; for (let i = 1; i < times.length; i++) d.push(times[i] - times[i - 1]);
    const mean = d.reduce((a, b) => a + b, 0) / d.length, max = Math.max(...d), slow = d.filter((x) => x > 20).length;
    stats.innerHTML = `${what} ${times.length} 帧 · 帧间隔 平均 <b>${mean.toFixed(1)} ms</b>（${(1000 / mean).toFixed(0)} fps）· 最大 <b>${max.toFixed(1)} ms</b> · >20 ms 的帧 <b>${slow}</b> 个 · 滤镜 ${[...lens.classList].filter((c) => c.startsWith("f-") || c.startsWith("ab-")).join(" ") || "无"} · ${innerWidth}×${innerHeight} ${matchMedia("(display-mode: standalone)").matches ? "standalone" : "浏览器"}`;
    window.FRAME_STATS = { what, n: times.length, mean, max, slow };
    times = [];
  };
  lens.addEventListener("pointerdown", (e) => { dragging = { id: e.pointerId, x: e.clientX - X, y: e.clientY - Y }; lens.setPointerCapture(e.pointerId); times = []; requestAnimationFrame(tick); e.preventDefault(); });
  lens.addEventListener("pointermove", (e) => { if (!dragging || e.pointerId !== dragging.id) return; X = e.clientX - dragging.x; Y = e.clientY - dragging.y; place(); });
  const up = (e) => { if (dragging && e.pointerId === dragging.id) dragging = null; };
  lens.addEventListener("pointerup", up); lens.addEventListener("pointercancel", up);
  /* auto drag: 2 s back and forth across the row (a 60 Hz check without a finger) */
  const auto = document.getElementById("auto"); auto.running = false;
  auto.onclick = () => { if (auto.running) return; auto.running = true; times = []; const x0 = X, t0 = performance.now();
    const step = (t) => { const p = (t - t0) / 2000; X = x0 + Math.sin(p * Math.PI * 2) * 60; place(); if (p < 1) requestAnimationFrame(step); else { auto.running = false; X = x0; place(); report("自动拖"); } };
    requestAnimationFrame(tick); requestAnimationFrame(step); };
  for (const b of document.querySelectorAll("[data-f]")) b.onclick = () => { for (const x of document.querySelectorAll("[data-f]")) x.classList.toggle("on", x === b); lens.className = "lens " + b.dataset.f; place(); };
  document.getElementById("grat").onclick = () => { scene.classList.remove("gratingy"); scene.classList.toggle("grating"); sync(); };
  document.getElementById("graty").onclick = () => { scene.classList.remove("grating"); scene.classList.toggle("gratingy"); sync(); };
})();
</script>
