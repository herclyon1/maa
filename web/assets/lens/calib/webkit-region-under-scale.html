<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 引擎校正 2 record (2026-09-19): a 440×88 filtered layer (content scaled 2× inside) under a ½-scaled ancestor. The map calib-step25.png
     (u −4 beyond 25 % of the map) shifts the marks beyond page x 165 by 4 pt ONLY when the filter region is written as 50 % × 50 %
     (R1–R3 below); with 100 % (the reference filter of R0, or the same filter on R1–R3) the step lands at 220 = the map stretched
     over twice the layer: WebKit resolves the objectBoundingBox region of a layer under a scaled ancestor in unscaled units.
     Read with the marks: unfiltered 140 / 170 / 210 / 260 / 300 → 140 / 174 / 214 / 264 / 304. --><style>
body{margin:0;background:#fff}
.w{position:absolute;left:110px;width:220px;height:44px;transform-origin:0 0}
.box{position:absolute;left:0;top:0;width:440px;height:88px;overflow:hidden}
.in{position:absolute;left:0;top:0;width:220px;height:44px;transform:scale(2);transform-origin:0 0}
.mark{position:absolute;background:#000}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
<filter id="step" x="0" y="0" width="50%" height="50%" color-interpolation-filters="sRGB"><feImage href="calib-step25.png" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="80" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="step1" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feImage href="calib-step25.png" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="40" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<!-- R0: plain reference: box 220x44 no ss, step map scale 40 (marks 190/205/214 → the step at map x 200 → marks beyond 200 shift +4) -->
<div class="w" style="top:10px"><div class="box" style="width:220px;height:44px;filter:url(#step1)"><div class="mark" style="left:30px;top:0;width:3px;height:44px"></div><div class="mark" style="left:60px;top:0;width:3px;height:44px"></div><div class="mark" style="left:100px;top:0;width:3px;height:44px"></div><div class="mark" style="left:150px;top:0;width:3px;height:44px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div></div><div class="mark" style="left:120px;top:20px;width:60px;height:4px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div><div class="mark" style="left:205px;top:0;width:3px;height:44px"></div><div class="mark" style="left:214px;top:0;width:3px;height:44px"></div></div></div>
<!-- R1: ss with the wrapper transformed (composited) -->
<div class="w" style="top:60px;transform:scale3d(.5,.5,1);will-change:transform"><div class="box" style="filter:url(#step)"><div class="in"><div class="mark" style="left:30px;top:0;width:3px;height:44px"></div><div class="mark" style="left:60px;top:0;width:3px;height:44px"></div><div class="mark" style="left:100px;top:0;width:3px;height:44px"></div><div class="mark" style="left:150px;top:0;width:3px;height:44px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div></div><div class="mark" style="left:120px;top:20px;width:60px;height:4px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div><div class="mark" style="left:205px;top:0;width:3px;height:44px"></div><div class="mark" style="left:214px;top:0;width:3px;height:44px"></div></div></div></div>
<!-- R2: ss with the wrapper transformed, NOT composited (2D transform, no will-change) -->
<div class="w" style="top:110px;transform:scale(.5)"><div class="box" style="filter:url(#step)"><div class="in"><div class="mark" style="left:30px;top:0;width:3px;height:44px"></div><div class="mark" style="left:60px;top:0;width:3px;height:44px"></div><div class="mark" style="left:100px;top:0;width:3px;height:44px"></div><div class="mark" style="left:150px;top:0;width:3px;height:44px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div></div><div class="mark" style="left:120px;top:20px;width:60px;height:4px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div><div class="mark" style="left:205px;top:0;width:3px;height:44px"></div><div class="mark" style="left:214px;top:0;width:3px;height:44px"></div></div></div></div>
<!-- R3: ss, no wrapper: the box itself transformed + composited -->
<div class="w" style="top:160px"><div class="box" style="filter:url(#step);transform:scale3d(.5,.5,1);transform-origin:0 0;will-change:transform"><div class="in"><div class="mark" style="left:30px;top:0;width:3px;height:44px"></div><div class="mark" style="left:60px;top:0;width:3px;height:44px"></div><div class="mark" style="left:100px;top:0;width:3px;height:44px"></div><div class="mark" style="left:150px;top:0;width:3px;height:44px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div></div><div class="mark" style="left:120px;top:20px;width:60px;height:4px"></div><div class="mark" style="left:190px;top:0;width:3px;height:44px"></div><div class="mark" style="left:205px;top:0;width:3px;height:44px"></div><div class="mark" style="left:214px;top:0;width:3px;height:44px"></div></div></div></div>
</body></html>
