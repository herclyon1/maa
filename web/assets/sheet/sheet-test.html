<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Page sheet — static geometry (B7)</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  /* B7 visual package test page (2026-09-19, 界面2号): the page sheet (#picker's model, UISheetPresentationController .pageSheet, detents
     [.large()]) as STATIC geometry + dimming + the Done button, from the --ios-pagesheet-* tokens (tokens.css; sources there). Compared
     against tools/touch/sheet-native-{light,dark}-presented.png at the same coordinates by geom_check.py (README §0.9). Not the app's
     #picker; nothing here is wired. The screen: 440×956, the sheet's top = the safe area's top 62 (sheet-native.md §0). The page behind
     = the probe app's Modals page colour (systemGroupedBackground light / systemBackground dark) so the dimmed rows compare 1:1. */
  :root{--page-behind:rgb(242 242 247);--sheet-content:rgb(242 242 247);--title:rgb(0 0 0)}
  @media (prefers-color-scheme: dark){:root{--page-behind:rgb(0 0 0);--sheet-content:rgb(28 28 30);--title:rgb(255 255 255)}}
  html,body{margin:0;height:100%;background:var(--page-behind);font-family:var(--ios-font);-webkit-font-smoothing:antialiased}
  .screen{position:relative;width:440px;height:956px;overflow:hidden;background:var(--page-behind)}
  /* UIDimmingView: covers everything, black α .2 / .48 (tokens --ios-pagesheet-dim) */
  .dim{position:absolute;inset:0;background:var(--ios-pagesheet-dim)}
  /* UIDropShadowView (0, 62, 440, 894): systemBackground, cornerRadii top 38 bottom 62 (continuous — CSS has no continuous curve; the
     circular radius is what is compared), no shadow (opacity 0) */
  .sheet{position:absolute;left:0;top:var(--ios-pagesheet-top);width:440px;height:var(--ios-pagesheet-h);background:var(--ios-pagesheet-bg);
         border-radius:var(--ios-pagesheet-radius-top) var(--ios-pagesheet-radius-top) var(--ios-pagesheet-radius-bottom) var(--ios-pagesheet-radius-bottom);overflow:hidden}
  /* the probe VC's content fills the sheet (systemGroupedBackground); the nav bar's _UIBarBackground has no content at the top */
  .content{position:absolute;inset:0;background:var(--sheet-content)}
  /* UINavigationBar (0, 82, 440, 54) in the sheet's frame → y 20; the title UILabel (175.67, 93.67, 88.33, 20.67) .SFUI-Semibold 17 */
  .title{position:absolute;left:0;right:0;top:calc(var(--ios-pagesheet-title-y) - var(--ios-pagesheet-top));height:var(--ios-pagesheet-title-h);line-height:var(--ios-pagesheet-title-h);
         text-align:center;font-size:17px;font-weight:600;color:var(--title)}
  /* the Done button: UIPlatformGlassInteractionView 44×44 at (376, 82) → in the sheet (376, 20); a 44 disc tinted systemBlue (the glass keys unread: a flat
     disc here); the check UIImageView 24×22.67 at (386, 93) → (10, 11) inside the disc; the glyph shape is an approximation of SF Symbols
     checkmark (the symbol itself is not shipped) — only its box is compared */
  .done{position:absolute;left:var(--ios-pagesheet-done-x);top:calc(var(--ios-pagesheet-done-y) - var(--ios-pagesheet-top));width:var(--ios-pagesheet-done-size);height:var(--ios-pagesheet-done-size);
        border-radius:50%;background:var(--ios-pagesheet-done-tint)}
  /* the check's INK box measured on sheet-native-dark-presented.png: 389–407 × 95.33–113.33 = 18 × 18 at (13, 13.33) in the disc (the UIImageView frame
     24×22.67 at (10, 11) is larger than its ink); the path is an approximation of SF Symbols checkmark drawn into that box */
  .done svg{position:absolute;left:13px;top:13.33px;width:18px;height:18px}
</style>
</head>
<body>
<div class="screen">
  <div class="dim"></div>
  <div class="sheet"><div class="content">
    <div class="title">Page sheet</div>
    <div class="done" role="button" aria-label="完成"><svg viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 9.6 L6.6 15.6 L16.4 2.4"/></svg></div>
  </div></div>
</div>
</body>
</html>
