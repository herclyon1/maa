# Game-layer harness, OK-WW part: the real OK-WW and ok-script, our overlay installed by the
# relay's own installer, on Windows (gamesim design section 1).
#
# Why Windows: ok-script imports pywin32 at module top (ok/util/window.py) and OK-WW's
# src/combat/CombatCheck.py does too, so the framework does not import on macOS. OK-WW's own
# CI runs its tests on windows-latest (ok-wuthering-waves .github/workflows/test.yml).
#
# Two interpreters, one per side, as on the game PC:
#   - 3.12.10 runs OK-WW: the PC's OK-WW python.exe VersionInfo (scratchpad gamesim/u0/
#     versions.json, read 2026-10-13); OK-WW's app.json says requires_python 3.12.
#   - 3.14.8 runs the relay side (okww_overlay.install, report_line): the relay's Python
#     (relay-windows.yml).
#
# Lanes come from relay/tests/gamesim/okww/ci_prepare.py (LANES, plus the GAMESIM_LANES a test
# file declares), and the tests in a lane by glob there; the matrix is `ci_prepare.py lanes`
# (job `lanes`), so neither a new test file nor a new lane needs an edit here.
# `installed` is the gate; every other lane (p1-*, p2-*, weekly-*, t13-*, t14-*, u7-*) is a
# red-before-green proof (a red lane passes only when its cases fail at an assertion, and, where
# the lane names one, the relay says what it said on the machine).
#
# Cost: "GitHub Actions usage is free for ... public repositories that use standard
# GitHub-hosted runners." (docs.github.com, about billing for GitHub Actions)
name: gamesim-windows

# Triggers (design section 4): every push to main and to relay-* is the commit a deploy may
# ship, and deploy-relay.sh step 0.9 (scripts/mac/lib/ci_green.py) refuses a commit without a
# green run here; gamesim-ci-* is for trying a branch. The design's daily run against OK-WW's
# newest tag needs a lane that fetches an unpinned tag, which ci_prepare.py does not have yet.
on:
  push:
    branches:
      - 'main'
      - 'relay-*'
      - 'gamesim-ci-*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: List the lanes
        id: lanes
        run: |
          lanes=$(python relay/tests/gamesim/okww/ci_prepare.py lanes)
          echo "$lanes"
          echo "lanes=$lanes" >>"$GITHUB_OUTPUT"

  okww:
    name: okww (${{ matrix.lane }})
    needs: lanes
    runs-on: windows-latest
    # OK-WW's release run 37291261628 took 3.5 min in all (pip install 55 s, 36 test
    # modules 1 min 50 s; gamesim design section 1); 30 leaves room for a slow runner and
    # the OK-WW fetch.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.lanes.outputs.lanes) }}
    defaults:
      run:
        shell: bash
    env:
      # Tests print Chinese to a redirected stdout; before 3.15 Windows uses the locale code
      # page for it (same reason as relay-windows.yml).
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      # OCR runs on OpenVINO's CPU plugin here. Some windows-latest VMs (Emerald Rapids,
      # family 6 model 207) report AMX in CPUID.7 and XCR0 but an empty palette in CPUID.1D
      # (actions/runner-images#14483); OpenVINO 2026.3's oneDNN trusts the first two, runs
      # TILEZERO and the test dies with 0xC000001D (openvinotoolkit/openvino#37076,
      # uxlfoundation/oneDNN#5689). Capping oneDNN below AMX keeps AVX-512 FP16; OpenVINO
      # 2026.3 builds oneDNN with DNNL_ENABLE_MAX_CPU_ISA ON, so the cap is honoured
      # (src/plugins/intel_cpu/thirdparty/CMakeLists.txt:52). The game PC is not affected.
      ONEDNN_MAX_CPU_ISA: AVX512_CORE_FP16
    steps:
      # The PC gets OK-WW's and our LF bytes; the pinned hashes are of those.
      - name: Check out files as they are in the repo (LF)
        run: git config --global core.autocrlf false
      # Whole history: the p1 lanes read the overlay at old commits (git show).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        id: okww
        with:
          python-version: '3.12.10'
      - uses: actions/setup-python@v7
        id: relay
        with:
          python-version: '3.14.8'

      - name: Interpreters
        run: |
          echo "OKWW_PY=${{ steps.okww.outputs.python-path }}" >>"$GITHUB_ENV"
          echo "RELAY_PY=${{ steps.relay.outputs.python-path }}" >>"$GITHUB_ENV"
          "${{ steps.okww.outputs.python-path }}" -c 'import sys; v = sys.version_info[:3]; print(sys.executable, v); assert v == (3, 12, 10), v'
          "${{ steps.relay.outputs.python-path }}" -c 'import sys; v = sys.version_info[:3]; print(sys.executable, v); assert v == (3, 14, 8), v'

      - name: Fetch OK-WW at the pinned commit and install the overlay
        run: |
          "$RELAY_PY" relay/tests/gamesim/okww/ci_prepare.py prepare --lane "${{ matrix.lane }}" --root "$RUNNER_TEMP/okww"

      # OK-WW's pinned requirements from the fetched upstream copy (ci_prepare.py copies them
      # out of relay/tests/gamesim/upstream/okww-<tag>/), plus onnxocr at the PC's version.
      - name: Install OK-WW's pinned requirements
        run: |
          "$OKWW_PY" -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/okww/pip-requirements.txt" -c "$RUNNER_TEMP/okww/pip-constraints.txt"
          # No pipe here: the step's bash runs with pipefail, and `| head` broke pip's stdout
          # (run 38377925360, p1-red lane: "ERROR: Pipe to stdout was broken", exit 120).
          "$OKWW_PY" -m pip show ok-script

      - name: Run the lane
        run: |
          "$RELAY_PY" relay/tests/gamesim/okww/ci_prepare.py run --lane "${{ matrix.lane }}" --root "$RUNNER_TEMP/okww" --python "$OKWW_PY" --out "$RUNNER_TEMP/gamesim-results" --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gamesim-okww-${{ matrix.lane }}
          path: ${{ runner.temp }}/gamesim-results
          if-no-files-found: warn
