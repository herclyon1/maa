# Installing, upgrading, deploying to and uninstalling the package on a clean Windows runner:
# installer (with the AUTO-MAS handover, against a stand-in backend) -> the relay starting a
# watchdog stopped not on purpose, and leaving one stopped on purpose -> a cancelled upgrade ->
# installer again (upgrade) -> deploy-pkg.sh end to end -> the handover's cases -> uninstall.
# The old relay was retired 2026-10-11; its stages went with its code. Stages and pass rules
# are in scripts/ci/package_switch_smoke.py. Never touches the game machine.
#
# Started by hand only, like package-windows.yml: a push to the branch package-switch-run
# (no other branch triggers it), or workflow_dispatch once the file is on main.
name: package-switch

on:
  workflow_dispatch: {}
  push:
    branches:
      - package-switch-run

permissions:
  contents: read

jobs:
  switch-both-ways:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      # LF bytes as on the game machine (see package-windows.yml)
      - name: Check out files as they are in the repo (LF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      # Runs the smoke script and the stand-in backend.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Install, upgrade, deploy, uninstall
        run: python scripts/ci/package_switch_smoke.py

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-switch
          path: |
            package-switch/*.log
            package-switch/*.txt
            package-switch/*.json
          if-no-files-found: ignore
