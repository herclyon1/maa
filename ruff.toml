# 这份配置是为了让仓库里那 255 个 `# noqa:` 有意义。
#
# 2026-09-08 审出来的：代码里到处写着 `# noqa: BLE001`、`# noqa: PLC0415`，
# 而仓库里既没有 ruff 配置也没有任何脚本或 CI 会去跑 ruff。也就是说这些注释
# 一条都没被验证过——其中一条把规则号写成了 `PLC4015`（正确的是 PLC0415），
# 静静地错了不知道多久。要么让它们真的生效，要么全删掉；留着假装有检查最糟。
#
# 选的规则集就是这些 noqa 引用到的那几类，不多选：目的是让已有的豁免成立，
# 不是给这个仓库套一套新的风格标准。
target-version = "py314"
line-length = 100
extend-exclude = [
    # 上游原样文件，不归我们管
    "relay/ark_relay/okww_files",
    # 补丁的「原文/改后」大段字符串，格式照上游，不按我们的规矩
    "relay/ark_relay/okww_patches",
]

[lint]
# **只选仓库里已经写了 noqa 的那些规则**，外加 RUF100。
# 目的不是给这个仓库套一套新风格，而是让已有的 255 条豁免真的成立、
# 让写错的规则号露出来。多选规则只会一次冒出上千条与本次无关的风格意见。
select = [
    "F",        # pyflakes：真错（未定义名、无用导入）
    "E402", "E731",
    "B018",
    "C901",
    "N802",
    "BLE001",
    "PERF203",
    "PLC0415", "PLW0603",
    # 2026-09-08 加的，为了一条真事故：有人在 core.State.save_pending 上面贴了
    # 一行多余的 @property，于是那个属性一被访问就抛 TypeError（getter 缺参数）。
    # 后果不是「存不上」，是**告警永远落不了账**——中继下一轮把同一条失败当成新的
    # 又推一遍，每十几秒一条，把用户的群轰炸了半小时。
    # pyflakes 不查这个，88 个测试也没有一个调用过那个方法，于是一路绿灯上了机器。
    "PLR0206",  # 带参数的 @property
    "RUF100",   # 写了却用不上的 noqa —— 正是这次要抓的那一类
]
# 故意**不选**的几类，因为这个仓库是有意这么写的，选了只会逼出满屏与本次无关的意见：
#   SLF001（私有成员访问）—— engine 被当命名空间到处传，eng._pending 是设计如此，428 处；
#   S310/S603/S607（urlopen、subprocess）—— 这套系统的本职就是跑别人的程序、取别人的文件；
#   E501（行长）—— 由人把握。
# 这些规则的 noqa 注释同时也一并删掉了：留着一条指向没启用规则的豁免，
# 和当初那条写错规则号的 PLC4015 是同一种东西——看着有检查，其实没有。

[lint.mccabe]
max-complexity = 25
