# 这份配置是为了让仓库里那 255 个 `# noqa:` 有意义。
#
# 2026-09-08 审出来的：代码里到处写着 `# noqa: BLE001`、`# noqa: PLC0415`，
# 而仓库里既没有 ruff 配置也没有任何脚本或 CI 会去跑 ruff。也就是说这些注释
# 一条都没被验证过——其中一条把规则号写成了 `PLC4015`（正确的是 PLC0415），
# 静静地错了不知道多久。要么让它们真的生效，要么全删掉；留着假装有检查最糟。
#
# 选的规则集就是这些 noqa 引用到的那几类，不多选：目的是让已有的豁免成立，
# 不是给这个仓库套一套新的风格标准。
target-version = "py314"
line-length = 100
extend-exclude = [
    # Runs inside OK-WW and copies upstream method bodies verbatim; not held to our style
    "relay/ark_relay/features/okww_patch/okww_files",
    # Verbatim upstream files the source pins are tested against
    "relay/tests/fixtures/source-pins",
]

[lint]
# The banner modules split out of banners.py (arknights, endfield, wuwa, wuwa_posters)
# log through banners.log, imported from it. Without this ruff does not know that name
# is a logger, so an `except Exception` that logs with exc_info=True reads as a blind
# catch (BLE001) there, while the same code in banners.py itself does not.
logger-objects = ["ark_relay.features.banners.banners.log"]
# **只选仓库里已经写了 noqa 的那些规则**，外加 RUF100。
# 目的不是给这个仓库套一套新风格，而是让已有的 255 条豁免真的成立、
# 让写错的规则号露出来。多选规则只会一次冒出上千条与本次无关的风格意见。
# Exception since 2026-10-11: "B" (flake8-bugbear) at the end of this list, for bugs
# rather than style; see the note there.
select = [
    "F",        # pyflakes：真错（未定义名、无用导入）
    "E402", "E731",
    "B018",
    "C901",
    "N802",
    "BLE001",
    "PERF203",
    "PLC0415", "PLW0603",
    # 2026-09-08 加的，为了一条真事故：有人在 core.State.save_pending 上面贴了
    # 一行多余的 @property，于是那个属性一被访问就抛 TypeError（getter 缺参数）。
    # 后果不是「存不上」，是**告警永远落不了账**——中继下一轮把同一条失败当成新的
    # 又推一遍，每十几秒一条，把用户的群轰炸了半小时。
    # pyflakes 不查这个，88 个测试也没有一个调用过那个方法，于是一路绿灯上了机器。
    "PLR0206",  # 带参数的 @property
    "RUF100",   # 写了却用不上的 noqa —— 正是这次要抓的那一类
    # 2026-10-11: flake8-bugbear (B), the "easy place for a bug to hide" class
    # (https://docs.astral.sh/ruff/rules/#flake8-bugbear-b). The relay code (relay/ark_relay,
    # relay/*.py, scripts/windows) is at 0 and lint-repo item 24 keeps it there; selecting
    # it here as well is what lets a `# noqa: B023` in that code pass RUF100 above.
    "B",
]
# 故意**不选**的几类，因为这个仓库是有意这么写的，选了只会逼出满屏与本次无关的意见：
#   SLF001（私有成员访问）—— engine 被当命名空间到处传，eng._pending 是设计如此，428 处；
#   S310/S603/S607（urlopen、subprocess）—— 这套系统的本职就是跑别人的程序、取别人的文件；
#   E501（行长）—— 由人把握。
# 这些规则的 noqa 注释同时也一并删掉了：留着一条指向没启用规则的豁免，
# 和当初那条写错规则号的 PLC4015 是同一种东西——看着有检查，其实没有。

[lint.per-file-ignores]
# Out of the relay scope that item 24 checks, and not cleaned up (2026-10-11 counts:
# B007 17, B023 14, B904 2 across these three trees). B018 stays on there, as it was
# before B was selected.
"relay/tests/**" = ["B007", "B023", "B904"]
# B905 (zip() strict=, Python 3.10+) is off for these two: they are Mac tools run by the
# Mac's own python3 (3.9). The relay and its tests run on 3.14 (scripts/mac/lib/relay-python.sh).
"scripts/mac/**" = ["B007", "B023", "B904", "B905"]
"web/**" = ["B007", "B023", "B904", "B905"]

[lint.mccabe]
max-complexity = 25
